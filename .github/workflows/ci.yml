name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - node-version: 20
            eslint-version: 9.39.4
          - node-version: 22
            eslint-version: 10.10.0
          - node-version: 24
            eslint-version: 10.10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm install --no-save eslint@${{ matrix.eslint-version }}
      - run: npm test

  # One stable check name for branch rulesets; the matrix job names change with every version bump.
  ci:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
